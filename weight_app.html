<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121212">
<title>体重管理</title>
<style>
:root{color-scheme:dark;--bg:#121212;--cd:#1e1e1e;--tx:#e8e8e8;--sb:#9a9a9a;--ac:#4fc3f7;--ac2:#ffb74d;--up:#ef5350;--dn:#66bb6a;--ln:#333}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:12px 12px 80px}
.cd{background:var(--cd);border-radius:14px;padding:14px;margin-bottom:12px}
.sb{color:var(--sb);font-size:13px}
select,input,button{font:inherit;color:var(--tx);background:#2a2a2a;border:1px solid var(--ln);border-radius:10px;padding:12px}
select{font-size:28px;padding:10px 4px;text-align:center;flex:1;min-width:0}
.pr{display:flex;align-items:center;gap:6px}.pr b{font-size:28px}
.st{display:flex;gap:8px;margin-top:8px}.st button{flex:1}
.d{min-height:24px;margin-top:8px;font-size:18px}
.pri{width:100%;background:var(--ac);color:#000;font-weight:700;font-size:18px;margin-top:16px;border:0;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1a1a1a;border-top:1px solid var(--ln)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:16px 0;color:var(--sb)}
nav .on{color:var(--ac);font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:10px 0}.seg .on{background:var(--ac);color:#000}
canvas{width:100%;height:260px;display:block}
table{width:100%;border-collapse:collapse}td,th{padding:9px 3px;border-bottom:1px solid var(--ln);text-align:right;font-size:14px}
th{color:var(--sb);font-weight:400;font-size:12px}td:first-child,th:first-child{text-align:left}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}
dialog{background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:14px;width:92%;max-width:420px}
dialog::backdrop{background:#000a}
#ts{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#333;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
</style></head><body>
<div id="app"></div><div id="ts"></div><dialog id="md"></dialog>
<nav><button data-v="in">記録</button><button data-v="gr">グラフ</button><button data-v="mo">月別</button><button data-v="hi">履歴</button></nav>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),K='wt_v1';
const nowS=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
let D=[],V='in',R=30,dirty=false;
try{D=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const srt=()=>[...D].sort((a,b)=>a.t<b.t?1:-1);
const op=(a,b,v)=>{let s='';for(let i=a;i<=b;i++)s+=`<option${i==v?' selected':''}>${i}</option>`;return s};
const LIM={w:[30,200],f:[3,70],mw:[30,200],mf:[3,70]};
const pair=(id,v)=>{v=Math.round(v*10)/10;const i=Math.floor(v+1e-9),d=Math.round((v-i)*10),[a,b]=LIM[id];return`<div class=pr><select id=${id}i>${op(a,b,i)}</select><b>.</b><select id=${id}d>${op(0,9,d)}</select></div>`};
const gv=id=>+$('#'+id+'i').value+ +$('#'+id+'d').value/10;
const stv=(id,v)=>{const[a,b]=LIM[id];v=Math.round(Math.min(b+.9,Math.max(a,v))*10)/10;const i=Math.floor(v+1e-9);$('#'+id+'i').value=i;$('#'+id+'d').value=Math.round((v-i)*10)};
const df=(x,u)=>{if(x==null)return'-';x=Math.round(x*10)/10;return`<span class="${x>0?'up':x<0?'dn':''}">${x>0?'▲+':x<0?'▼−':'±'}${Math.abs(x).toFixed(1)}${u}</span>`};
function toast(m){const t=$('#ts');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1500)}
function upd(){const t=$('#dt').value,p=srt().find(r=>r.t<t);
$('#dw').innerHTML=p?`前回比 ${df(gv('w')-p.w,' kg')}`:'初回の記録です';
$('#dfat').innerHTML=p?`前回比 ${df(gv('f')-p.f,' %')}`:''}
function render(){
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V));
const a=$('#app');
if(V=='in'){const l=srt()[0]||{w:60,f:20};
a.innerHTML=`<div class=cd><div class=sb>日時（自動・変更可）</div><input type=datetime-local id=dt value="${nowS()}" style="width:100%;margin-top:6px">
<div class=sb style="margin:18px 0 6px">体重 (kg)</div>${pair('w',l.w)}
<div class=st><button data-a="w,-0.1">−0.1</button><button data-a="w,0.1">＋0.1</button></div><div id=dw class=d></div>
<div class=sb style="margin:14px 0 6px">体脂肪率 (%)</div>${pair('f',l.f)}
<div class=st><button data-a="f,-0.1">−0.1</button><button data-a="f,0.1">＋0.1</button></div><div id=dfat class=d></div>
<button class=pri id=sv>記録する</button></div>`;upd()}
else if(V=='gr'){
a.innerHTML=`<div class=cd><div class=seg>${[['1W',7],['1M',30],['3M',91],['6M',182],['1Y',365]].map(([n,d])=>`<button class="${R==d?'on':''}" data-r=${d}>${n}</button>`).join('')}</div><canvas id=cv></canvas><div class=sb style="margin-top:8px"><span style=color:var(--ac)>● 体重（左軸）</span>　<span style=color:var(--ac2)>● 体脂肪率（右軸）</span></div></div>`;draw()}
else if(V=='mo'){
const m={};D.forEach(r=>(m[r.t.slice(0,7)]=m[r.t.slice(0,7)]||[]).push(r));
const av=(a,k)=>a.reduce((s,x)=>s+x[k],0)/a.length;
const rows=Object.keys(m).sort().reverse().map(k=>{const y=+k.slice(0,4),mo=+k.slice(5),p=m[mo==1?`${y-1}-12`:`${y}-${pad(mo-1)}`],w=av(m[k],'w'),f=av(m[k],'f');
return`<tr><td>${y}/${mo}</td><td>${w.toFixed(1)}</td><td>${p?df(w-av(p,'w'),''):'-'}</td><td>${f.toFixed(1)}</td><td>${p?df(f-av(p,'f'),''):'-'}</td></tr>`}).join('');
a.innerHTML=`<div class=cd><table><tr><th>月</th><th>平均体重kg</th><th>前月比</th><th>平均体脂肪%</th><th>前月比</th></tr>${rows||'<tr><td colspan=5 class=sb>記録なし</td></tr>'}</table></div>`}
else{
a.innerHTML=`<button id=csv class=pri style="margin:0 0 12px">CSV出力（端末のダウンロードに保存）</button><div class=cd>${srt().map(r=>`<div class=row data-e=${r.id}><span>${r.t.replace('T',' ')}</span><span>${r.w.toFixed(1)} kg　${r.f.toFixed(1)} %</span></div>`).join('')||'<div class=sb>記録なし</div>'}</div><div class=sb>行をタップで編集・削除</div>`}}
function draw(){const c=$('#cv');if(!c)return;
const W=c.clientWidth,H=260,r=devicePixelRatio||1;c.width=W*r;c.height=H*r;const g=c.getContext('2d');g.scale(r,r);
const t0=Date.now()-R*864e5,t1=Date.now(),rs=D.filter(x=>+new Date(x.t)>=t0).sort((a,b)=>a.t<b.t?-1:1);
g.font='11px sans-serif';
if(!rs.length){g.fillStyle='#9a9a9a';g.textAlign='center';g.fillText('この期間のデータなし',W/2,H/2);return}
const P={l:40,r:40,t:12,b:24},iw=W-P.l-P.r,ih=H-P.t-P.b,X=x=>P.l+iw*((+new Date(x.t)-t0)/(t1-t0));
g.strokeStyle='#333';g.lineWidth=1;for(let i=0;i<=4;i++){const y=P.t+ih*i/4;g.beginPath();g.moveTo(P.l,y);g.lineTo(W-P.r,y);g.stroke()}
g.fillStyle='#9a9a9a';g.textAlign='left';const dt=t=>{const d=new Date(t);return`${d.getMonth()+1}/${d.getDate()}`};
g.fillText(dt(t0),P.l,H-6);g.textAlign='right';g.fillText(dt(t1),W-P.r,H-6);
[['w','#4fc3f7',P.l,1],['f','#ffb74d',W-P.r,0]].forEach(([k,col,ax,left])=>{
const v=rs.map(x=>x[k]);let a=Math.min(...v),b=Math.max(...v);if(a==b){a-=1;b+=1}const pd=(b-a)*.1;a-=pd;b+=pd;
const Y=y=>P.t+ih*(1-(y-a)/(b-a));
g.fillStyle=col;g.textAlign=left?'right':'left';const ox=ax+(left?-4:4);g.fillText(b.toFixed(1),ox,P.t+9);g.fillText(a.toFixed(1),ox,P.t+ih);
g.strokeStyle=col;g.lineWidth=2;g.beginPath();rs.forEach((x,i)=>i?g.lineTo(X(x),Y(x[k])):g.moveTo(X(x),Y(x[k])));g.stroke();
if(rs.length<60)rs.forEach(x=>{g.beginPath();g.arc(X(x),Y(x[k]),3,0,7);g.fill()})})}
function exp(){const rows=[['日時','体重(kg)','体脂肪率(%)'],...[...D].sort((a,b)=>a.t<b.t?-1:1).map(r=>[r.t.replace('T',' '),r.w,r.f])];
const b=new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\r\n')],{type:'text/csv'}),a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download=`weight_${nowS().slice(0,10).replace(/-/g,'')}.csv`;document.body.appendChild(a);a.click();a.remove();toast('CSVを保存しました')}
function openEd(id){const r=D.find(x=>x.id==id),m=$('#md');
m.innerHTML=`<input type=datetime-local id=et value="${r.t}" style="width:100%"><div class=sb style="margin:12px 0 6px">体重 (kg)</div>${pair('mw',r.w)}<div class=sb style="margin:12px 0 6px">体脂肪率 (%)</div>${pair('mf',r.f)}
<div class=pr style="margin-top:16px"><button id=mx style="flex:1">取消</button><button id=mdl style="flex:1;color:var(--up)">削除</button><button id=ms class=pri style="flex:2;margin:0;width:auto">保存</button></div>`;
$('#mx').onclick=()=>m.close();
$('#mdl').onclick=()=>{if(confirm('削除しますか？')){D=D.filter(x=>x.id!=id);sv();m.close();render()}};
$('#ms').onclick=()=>{r.t=$('#et').value||r.t;r.w=gv('mw');r.f=gv('mf');sv();m.close();render()};m.showModal()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-a],[data-r],[data-e],#sv,#csv');if(!t)return;
if(t.dataset.v){V=t.dataset.v;render()}
else if(t.dataset.a){const[k,d]=t.dataset.a.split(',');stv(k,gv(k)+ +d);upd()}
else if(t.dataset.r){R=+t.dataset.r;render()}
else if(t.dataset.e)openEd(+t.dataset.e);
else if(t.id=='sv'){D.push({id:Date.now(),t:$('#dt').value||nowS(),w:gv('w'),f:gv('f')});sv();dirty=false;toast('記録しました');render()}
else if(t.id=='csv')exp()});
document.addEventListener('change',e=>{if(e.target.id=='dt')dirty=true;if($('#dw')&&!$('#md').open)upd()});
addEventListener('resize',draw);
setInterval(()=>{if(V=='in'&&!dirty&&$('#dt'))$('#dt').value=nowS()},20000);
render();
</script></body></html>
